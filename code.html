<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin-top: 100px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Armstrong Number Checker</h2>

        <input type="number" id="num" placeholder="Enter a number">

        <br>

        <button onclick="checkArmstrong()">
            Check
        </button>

        <p id="result"></p>
    </div>

    <script>
        function checkArmstrong() {

            let num = document.getElementById("num").value;
            let original = num;
            let digits = num.length;
            let sum = 0;

            while (num > 0) {
                let rem = num % 10;
                sum += rem ** digits;
                num = Math.floor(num / 10);
            }

            if (sum == original) {
                document.getElementById("result").innerHTML =
                    original + " is an Armstrong Number";
            } else {
                document.getElementById("result").innerHTML =
                    original + " is Not an Armstrong Number";
            }
        }
    </script>

</body>
</html>
